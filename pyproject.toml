[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-detection-yolov8"
version = "0.1.0"
description = "Honest, reproducible vehicle detection (car, motorcycle, truck) with YOLO."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
train = ["ultralytics==8.4.174"]
app = ["gradio==6.30.0", "ultralytics==8.4.174"]
report = ["matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]